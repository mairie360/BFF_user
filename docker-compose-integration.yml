# Integration test stack of the BFF User (MAIR-262): the same upstream services as the ZAP / k6
# stacks (published Core API image, seeded database, fake Resend) plus a `newman` runner that replays
# the committed Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-user:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-76437e3}
    container_name: bff-user-int-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-76437e3}
    container_name: bff-user-int-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    container_name: bff-user-int-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-user-int-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fake Resend API (MAIR-552): answers the e-mails Core sends for POST /auth/forgot_password
  # (tests/fake-resend/README.md).
  fake-resend:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    container_name: bff-user-int-fake-resend
    command: ["--port", "8080", "--global-response-templating"]
    volumes:
      - ./tests/fake-resend/mappings:/home/wiremock/mappings:ro
    expose:
      - "8080"
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-156a9b9}
    container_name: bff-user-int-core-api
    depends_on:
      fake-resend:
        condition: service_started
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Rate limits on (MAIR-679): the collection checks that one client flooding forgot_password does not lock the
      # others, which needs Core to count per client address. Core trusts the X-Forwarded-For of private peers (the
      # BFF container) by default. The journeys stay far below its budgets.
      # Core sends the password e-mails through Resend (MAIR-522): here the fake one.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend:8080"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
      # MAIR-609: enables the Keycloak console link of POST /admin/keycloak/console-access. The realm URL is Core's
      # own address here, so the link it returns (`<host>/admin-access?token=…`) can be opened in the stack.
      KEYCLOAK_ISSUER: http://core-api:3000/realms/mairie360
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-user-int-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://core-api:3000/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 3 min"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-user:
    image: ${IMAGE_REF:-bff-user:local}
    container_name: bff-user-int-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4000
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      CORE_API_URL: http://core-api:3000
      # Rate limits on (MAIR-679), with the production budgets: newman reaches the BFF from the stack network, which
      # is trusted like the in-cluster fronts, so an X-Forwarded-For set by a request names its client.
      TRUST_PROXY: "uniquelocal"
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the `bff-user` service. `baseUrl`, the fake Resend
  # URL and the JWTs of the run (EdDSA, signed by integration_test.sh, MAIR-680) are injected here so the committed environment stays usable from a
  # host shell. The reports (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  newman:
    image: postman/newman:6.1.3-alpine@sha256:d9b5e780ead0026bbb37f3759cd7b10fc8a88cd4030c8266a7c5e343d75a5198
    container_name: bff-user-int-newman
    depends_on:
      bff-user:
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://bff-user:4000
      --env-var fakeResendUrl=http://fake-resend:8080
      --env-var coreUrl=http://core-api:3000
      --env-var jwt_admin=${JWT_ADMIN:?JWT_ADMIN must be set, run ./integration_test.sh}
      --env-var jwt_agent=${JWT_AGENT:?JWT_AGENT must be set, run ./integration_test.sh}
      --env-var jwt_forged=${JWT_FORGED:?JWT_FORGED must be set, run ./integration_test.sh}
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend
