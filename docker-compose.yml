volumes:
  postgres-data:
  redis-data:
  bff-user-target:

secrets:
  npmrc:
    file: ./.npmrc
  node_auth_token:
    environment: NODE_AUTH_TOKEN

networks:
  backend:
    name: ${USER_BACKEND_NETWORK:-bff_user_backend}

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 4000
  REDIS_URL: redis://redis:6379
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_HOST: postgres
  DB_PASSWORD: password
  DB_PORT: 5432

x-depends-on: &depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

# x-healthcheck: &healthcheck
#   test: ["CMD", "curl", "-f", "http://localhost:4000"]
#   interval: 10s
#   timeout: 5s
#   retries: 5

x-service: &service-template
  image: ghcr.io/mairie360/service_name:1.0.0
  pull_policy: always
  restart: always
  expose:
    - "4000"
  networks:
    - backend
  # healthcheck:
  #   <<: *healthcheck

services:
  postgres:
    image: ghcr.io/mairie360/database:dev-3c50ecb
    restart: always
    container_name: mairie360-db-bff-user
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: ghcr.io/mairie360/liquibase-migrations:dev-3c50ecb
    container_name: mairie360-liquibase-bff-user
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: ${DB_USER:-postgres}
      LIQUIBASE_COMMAND_PASSWORD: ${DB_PASSWORD:-password}
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: mairie360-redis-bff-user #change api name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    container_name: core-bff-user-developpement
    image: ghcr.io/mairie360/core-api:dev-73b4577
    ports:
      - "3000:3000"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DB_TYPE: postgres
      DB_NAME: mairie_360_database
      DB_USER: postgres
      DB_HOST: postgres
      DB_PASSWORD: password
      DB_PORT: 5432
      PUBLIC_URL: http://core.development.mairie360.fr
      JWT_SECRET: b"secret"
      # mairie360_api_lib >= 2.0 refuses the well-known b"secret" without this flag. Local stack only:
      # a deployment uses a random secret of at least 32 bytes (MAIR-428).
      JWT_ALLOW_WEAK_SECRET: "true"
      JWT_TIMEOUT: 3600
      # Core API >= 2.0.0 sends the password e-mails itself: no SMTP server locally, nothing is delivered.
      EMAIL_FROM: "noreply.mairie360@dev.local"
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"] # <--- Doit être 3000
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s
  
  #add other apis if needed

  bff-user:
    container_name: bff-user-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - npmrc
        - node_auth_token
    # Mode synchronisation en temps réel (Docker Compose V2)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    ports:
      - "4000:4000"
    networks:
      - backend
    environment:
      # Le BFF n'accède ni à PostgreSQL ni à Redis : tout passe par Core API.
      HOST: "0.0.0.0"
      PORT: 4000
      JWT_SECRET: 'b"secret"'
      # IMPORTANT : On utilise le nom du service Docker pour communiquer
      CORE_API_URL: "http://core:3000"
      # Keycloak single logout (POST /auth/logout returns logout_url), disabled while these are empty.
      # Public realm URL as the browser reaches it, same client as Core's KEYCLOAK_CLIENT_ID.
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      KEYCLOAK_POST_LOGOUT_REDIRECT_URI: ${KEYCLOAK_POST_LOGOUT_REDIRECT_URI:-}
    volumes:
      - /app/node_modules # Isolation des modules pour éviter les conflits OS (Mac/Windows vs Linux)
    # depends_on:
    #   core:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.29.1-bookworm
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    networks:
      - backend
    depends_on:
      bff-user: #change bff name
        condition: service_healthy
    extra_hosts:
          - "bff-user.development.mairie360.fr:127.0.0.1" #change bff name
