# GDPR usage simulation stack (MAIR-497) for the BFF User, test stack only: the services of
# docker-compose-gdpr-marker.yml (docker-compose-integration.yml's published Core API image, seeded
# database, Redis, fake Resend, on Database main's dev images with the GDPR schema) plus the
# `gdpr-simulation` runner of mairie360/CICD (tests/gdpr/simulation), which plays gdpr-simulation.yaml
# with fictitious personas through the BFF. gdpr_simulation_test.sh then back-dates and purges the
# rows of the run, checks the database and saves the logs of every container.
#
#   GDPR_SIMULATION=test-stack ./gdpr_simulation_test.sh                    (local)
#   GDPR_SIMULATION=test-stack IMAGE_REF=<image> ./gdpr_simulation_test.sh  (CI: the staging image)
#
# The session key pair and ADMIN_JWT come from stack_secrets.sh (fresh Ed25519 key pair per run,
# MAIR-428, MAIR-680).

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-c5b8e22}
    container_name: bff-user-sim-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-c5b8e22}
    container_name: bff-user-sim-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    container_name: bff-user-sim-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-user-sim-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fake Resend API (MAIR-552): answers the e-mails Core sends for POST /auth/forgot_password
  # (tests/fake-resend/README.md).
  fake-resend:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    container_name: bff-user-sim-fake-resend
    command: ["--port", "8080", "--global-response-templating"]
    volumes:
      - ./tests/fake-resend/mappings:/home/wiremock/mappings:ro
    expose:
      - "8080"
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-156a9b9}
    container_name: bff-user-sim-core-api
    depends_on:
      fake-resend:
        condition: service_started
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core sends the password e-mails through Resend (MAIR-522): here the fake one.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend:8080"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-user-sim-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded wait (90 tries, 3 min): an upstream that never answers fails `docker compose up` instead of
    # blocking the gate until the job timeout.
    command: >
      sh -c 'i=0; until curl -fsS http://core-api:3000/health >/dev/null; do
      i=$$((i+1)); if [ $$i -ge 90 ]; then echo "core-api not ready after 3 min"; exit 1; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-user:
    image: ${IMAGE_REF:-bff-user:local}
    container_name: bff-user-sim-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4000
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      CORE_API_URL: http://core-api:3000
      # The scanners replay the auth routes from a single IP with invalid credentials and tokens on
      # purpose: the auth rate limits would answer 429 and hide the real responses of the routes.
      AUTH_RATE_LIMIT_ENABLED: "false"
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-simulation:
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    container_name: bff-user-sim-runner
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-user:
        condition: service_healthy
    environment:
      # The engine refuses to run without it (test stacks only).
      GDPR_SIMULATION: ${GDPR_SIMULATION:?GDPR_SIMULATION=test-stack must be set, run gdpr_simulation_test.sh}
      HOME: /tmp
      # Admin JWT of the run (sub=1, the seeded Admin), EdDSA, signed by stack_secrets.sh like Core.
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run gdpr_simulation_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-simulation.yaml:/journey/gdpr-simulation.yaml:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-simulation:/run
    # The engine is copied out of the read-only mount before `npm ci` (no root-owned node_modules
    # in the host's cicd-repo/), like the marker runner (tests/gdpr/marker/run.sh).
    command:
      - sh
      - -c
      - >-
        mkdir -p /tmp/engine && tar -C /engine --exclude=./node_modules -cf - . | tar -C /tmp/engine -xf - &&
        cd /tmp/engine && npm ci --omit=dev --no-audit --no-fund --no-update-notifier --loglevel=error &&
        node simulation/simulate.mjs /journey/gdpr-simulation.yaml /run
    networks:
      - backend
